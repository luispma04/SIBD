<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>$title</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/style.css" />
  <style>
    body { font-family: 'Poppins', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    .card h2 { font-size: 20px; }
    .table tr:hover { background: rgba(11,105,255,0.03); }
    .actions { display:flex; gap:8px; align-items:center }
    .success { color: #059669; background: #d1fae5; padding: 10px; border-radius: 6px; margin: 10px 0; }
    .error { color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 6px; margin: 10px 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 style="color:white">Boating Management System</h1>
    </div>
    <nav class="nav" aria-label="Main navigation">
      <a class="btn ghost" href="sailors.cgi" style="color:white">Sailors</a>
      <a class="btn ghost" href="reservations.py" style="color:white">Reservations</a>
      <a class="btn ghost" href="trips.cgi" style="color:white">Trips</a>
      <a class="btn ghost" href="authorize.py" style="color:white">Authorizations</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <h2>$title</h2>
      <p class="muted">Manage trips: add, view and remove entries.</p>
      <p>
        <form action="trips.cgi" method="get" style="display:inline-block;margin:0">
          <button class="btn" name="add" value="1" type="submit" style="background:linear-gradient(90deg, #0b69ff 0%, #2f80ff 100%); color:white">Add trip</button>
        </form>
      </p>
      $message
      <table class="table">
        <thead>
          <tr>
            <th>Takeoff</th>
            <th>Arrival</th>
            <th>Route</th>
            <th>Skipper</th>
            <th>Boat</th>
            <th>Insurance</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          $rows
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
